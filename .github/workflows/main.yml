name: Build Framivio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Framivio-1.1-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Gradle
        run: |
          java -version
          gradle --version

      - name: Verify Android project
        run: |
          pwd
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Framivio-Debug-APK
          path: Framivio-1.1-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
