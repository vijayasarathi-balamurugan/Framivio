name: Build Framivio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Framivio-1.1-source

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Framivio-APK
          path: Framivio-1.1-source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
