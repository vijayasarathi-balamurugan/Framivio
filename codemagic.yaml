workflows:
  framivio-workflow:
    name: Framivio APK Build
    environment:
      flutter: stable

    scripts:
      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/Framivio-1.1-source"
          flutter pub get

      - name: Build Debug APK
        script: |
          cd "$CM_BUILD_DIR/Framivio-1.1-source"
          flutter build apk --debug

    artifacts:
      - Framivio-1.1-source/build/app/outputs/flutter-apk/*.apk