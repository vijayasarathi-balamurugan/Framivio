workflows:
  android-apk:
    name: Framivio Android APK
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Install dependencies
        script: |
          cd Framivio-1.1-source
          flutter pub get

      - name: Build Debug APK
        script: |
          cd Framivio-1.1-source
          flutter build apk --debug

    artifacts:
      - Framivio-1.1-source/build/app/outputs/flutter-apk/*.apk