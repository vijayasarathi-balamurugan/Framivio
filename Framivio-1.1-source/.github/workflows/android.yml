name: Framivio Android
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed Play Store bundle (requires release secrets)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  editor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Framivio-editor-test-results
          path: test-results/
  build:
    needs: editor-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Framivio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode your upload key
        if: ${{ inputs.release == true }}
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_BASE64" || { echo 'UPLOAD_KEY_BASE64 is missing'; exit 1; }
          echo "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/creatorfit-upload.jks"
      - name: Signed store bundle
        if: ${{ inputs.release == true }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/creatorfit-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APPLICATION_ID: ${{ vars.APPLICATION_ID }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          MONETIZATION_ENABLED: ${{ vars.MONETIZATION_ENABLED }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          BILLING_PUBLIC_KEY: ${{ secrets.BILLING_PUBLIC_KEY }}
          PRO_PRODUCT_ID: ${{ vars.PRO_PRODUCT_ID }}
        run: gradle --no-daemon lintRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release == true }}
        with:
          name: Framivio-play-store-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
